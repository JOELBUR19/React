<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/logo.png">
</head>

<body>

    <header>
        <img src="assets/logo.png" alt="Logo D4" class="logo" width="150px" height="auto">
        <h1>Es como el D1 pero D4</h1>
        <form class="barrabusqueda">
            <select class="categoria" aria-label="Filtrar por categoría">
                <option value="">Todo</option>
                <option value="vegetales">Vegetales</option>
                <option value="granos">Granos</option>
                <option value="lacteos">Lácteos</option>
                <option value="huevos">Huevos</option>
            </select>
            <input type="text" placeholder="Buscar..." aria-label="Buscar">
            <button type="submit">Buscar</button>
        </form>
    </header>

    <main>
        <section class="features">
            <article class="vegetales">
                <img src="assets/img1.png" alt="Papa fresca" width="100" height="100">
                <h3>Papa</h3>
                <p>$2.000 COP / Libra</p>
            </article>

            <article class="vegetales">
                <img src="assets/img2.png" alt="Tomate rojo" width="100" height="100">
                <h3>Tomate</h3>
                <p>$1.800 COP / Libra</p>
            </article>

            <article class="vegetales">
                <img src="assets/img3.png" alt="Cebolla cabezona" width="100" height="100">
                <h3>Cebolla</h3>
                <p>$1.500 COP / Libra</p>
            </article>

            <article class="huevos">
                <img src="assets/img4.png" alt="Huevos frescos" width="100" height="100">
                <h3>Huevos</h3>
                <p>$12.000 COP / Cubeta</p>
            </article>

            <article class="granos">
                <img src="assets/img5.png" alt="Arroz blanco" width="100" height="100">
                <h3>Arroz</h3>
                <p>$3.000 COP / Libra</p>
            </article>

            <article class="lacteos">
                <img src="assets/img6.png" alt="Leche entera" width="100" height="100">
                <h3>Leche</h3>
                <p>$3.200 COP / Bolsa</p>
            </article>
        </section>
    </main>

    <footer>
        <p>© D4 — Todos los derechos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
